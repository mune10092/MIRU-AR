<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>ARカメラ動作テスト</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
        color: #e2e8f0;
        font-family: sans-serif;
      }
      .app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #camera-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #020617;
      }
      #message-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(15, 23, 42, 0.72);
        z-index: 2;
        box-sizing: border-box;
      }
      .panel {
        width: min(520px, 100%);
        background: rgba(30, 41, 59, 0.92);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 16px;
      }
      .status {
        margin: 0 0 12px;
        font-size: 15px;
        line-height: 1.6;
        color: #e2e8f0;
      }
      .status-error {
        color: #fecaca;
      }
      .debug {
        margin: 0;
        padding: 10px;
        border-radius: 8px;
        background: #020617;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        display: flex;
        gap: 12px;
        justify-content: center;
        padding: 16px;
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
        background: linear-gradient(
          to top,
          rgba(2, 6, 23, 0.9),
          rgba(2, 6, 23, 0)
        );
        box-sizing: border-box;
      }
      button {
        min-width: 140px;
        height: 44px;
        border: 0;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
      }
      #start-btn {
        background: #38bdf8;
        color: #0f172a;
      }
      #stop-btn {
        background: #334155;
        color: #e2e8f0;
      }
      button:disabled {
        opacity: 0.5;
      }
      .top-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 3;
        color: #cbd5e1;
        font-size: 13px;
        text-decoration: none;
        background: rgba(15, 23, 42, 0.7);
        padding: 8px 10px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <a class="top-link" href="/tools/gauge-001">← 測定具詳細へ</a>
      <video
        id="camera-video"
        autoplay
        muted
        playsinline
        webkit-playsinline
      ></video>

      <div id="message-overlay">
        <div class="panel">
          <p id="status-text" class="status">初期状態</p>
          <pre id="debug-text" class="debug"></pre>
        </div>
      </div>

      <div class="controls">
        <button id="start-btn" type="button">カメラ開始</button>
        <button id="stop-btn" type="button" disabled>カメラ停止</button>
      </div>
    </div>

    <script>
      window.onerror = function (message) {
        var el = document.getElementById("status-text");
        if (el) {
          el.textContent = "JSエラー: " + message;
          el.className = "status status-error";
        }
      };
    </script>
    <script>
      (function () {
        var bundle = "/ar-camera-test.bundle.js";
        function fail() {
          var el = document.getElementById("status-text");
          if (el) el.textContent = "バンドルの読み込みに失敗しました";
        }
        function load(url) {
          var s = document.createElement("script");
          s.src = url;
          s.onerror = fail;
          document.body.appendChild(s);
        }
        function fallback() {
          load(bundle);
        }
        if (typeof fetch !== "function") {
          fallback();
          return;
        }
        fetch("/build-meta.json", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("no meta");
            return res.json();
          })
          .then(function (meta) {
            var v = meta && meta.files ? meta.files[bundle] : "";
            load(v ? bundle + "?v=" + v : bundle);
          })
          .catch(fallback);
      })();
    </script>
  </body>
</html>
