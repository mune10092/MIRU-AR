<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>GLB Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f1f5f9;
        font-family: sans-serif;
      }
      #canvas-host {
        position: absolute;
        inset: 0;
      }
      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        background: rgba(241, 245, 249, 0.92);
        z-index: 2;
        font-size: 14px;
        color: #475569;
      }
      #reset-btn {
        display: none;
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 3;
        border: 1px solid #cbd5e1;
        background: rgba(255, 255, 255, 0.95);
        color: #334155;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-host"></div>
    <div id="status">HTML表示OK / スクリプト待機中…</div>
    <button id="reset-btn" type="button">初期表示へ戻す</button>
    <script>
      function miruSetStatus(message, isError) {
        var el = document.getElementById("status");
        if (!el) return;
        el.textContent = message;
        el.style.display = message ? "flex" : "none";
        el.style.color = isError ? "#b91c1c" : "#475569";
      }
      window.miruSetStatus = miruSetStatus;
      miruSetStatus("インラインJS OK / バンドル読込中…");
      window.onerror = function (message) {
        miruSetStatus("JSエラー: " + message, true);
      };
    </script>
    <!-- onload で status を上書きしない（バンドル内の文言を正とする） -->
    <script
      src="/glb-viewer.bundle.js"
      onerror="miruSetStatus('バンドルの読み込みに失敗しました', true)"
    ></script>
  </body>
</html>
